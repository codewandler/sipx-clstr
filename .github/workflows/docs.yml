name: docs

# `docs/` is the deliverable and the website is a view of it, so a broken relative link here is a
# broken published page. The checks themselves live in `scripts/check-docs.py` so that the gate
# (`scripts/gate.sh`) and this job run the same code rather than two drifting copies of it.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # `CF-20`: vector coverage now means Cargo-discoverable execution evidence. The report check
      # compiles and lists the all-feature test harnesses rather than trusting Rust source shape.
      # `CX-15` removed the temporary sibling patch, so the checked job resolves only the immutable
      # kernel tag; the first observed GitHub run is still evidence `CF-20` records separately.
      - name: Install the Rust toolchain used for proof discovery
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Links resolve, epics have designs, design paths exist
        run: scripts/check-docs.sh

      # The conformance report is generated from the spec and the test names, so a spec row that
      # loses its proof — or a deferral that goes stale — fails here rather than quietly weakening
      # what the report claims.
      - name: Every spec vector is proved or deferred with a reason
        run: scripts/check-vectors.py --check

      # `KO-1`. The SipxCluster resource and cluster-config §7 are one definition; this fails when the
      # two drift. It reads the chart's `cluster:` keys, so unlike the checks around it, it needs a
      # YAML parser and has no weaker reading to fall back on.
      - name: The custom resource and the config schema are one definition
        run: |
          python3 -m pip install --quiet pyyaml
          scripts/check-crd-drift.py

      # `FC-5`. The end-to-end proofs are what the release's cluster claim rests on, and nothing else
      # in CI reads them — they need a database, a `sipx` CLI and in one case a Kubernetes cluster,
      # so they are run by hand. `FC-4` changed the node underneath them and three of them answered
      # `403` for a release cycle with every job green. This is the part of them a runner can check.
      - name: Every proof registers in a domain its own document serves
        run: scripts/check-proof-domains.py

      # `DX-12`. Orphan pages and dead commands are the two site defects that survive a green build:
      # Docusaurus happily publishes a page nothing links to, and no gate had ever read a documented
      # command, so ~30 of them invoked flags `DP-8` had deleted — through a release.
      #
      # This job installs Rust for Cargo's proof inventory but does not build the application binary,
      # so the CLI surface here is read statically from `main.rs`; the gate checks the real `--help`.
      # The script prints which source it used, so a run that verified less says so in its own output.
      - name: Every page is reachable and every documented command is real
        run: scripts/check-site.py

      - name: The board is in sync with story frontmatter
        run: |
          # The board is generated; a hand-edited or stale one is a defect. This asserts the
          # committed board matches what the frontmatter produces. The generator lives in the
          # track plugin rather than in this repo, so the check is conditional on it being here.
          if [ -f scripts/gen_board.py ]; then
            python3 scripts/gen_board.py docs
            git diff --exit-code -- docs/stories/README.md
          else
            echo "no board generator in-repo (it lives in the track plugin); skipping"
          fi
