name: docs

# The gate while there is no Cargo workspace (AGENTS.md → "The gate"): the
# documentation *is* the deliverable, so its consistency is what CI can check.
# When CX-2 lands the Rust workspace, this joins a build/test job rather than
# being replaced by one.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Relative links resolve
        run: |
          python3 - <<'PY'
          import re, pathlib, sys
          bad = []
          for md in sorted(pathlib.Path('.').rglob('*.md')):
              if any(p in ('.git', 'node_modules', 'build') for p in md.parts):
                  continue
              for m in re.finditer(r'\[([^\]]+)\]\(([^)]+)\)', md.read_text(encoding='utf-8')):
                  target = m.group(2)
                  if target.startswith(('http://', 'https://', '#', 'mailto:')):
                      continue
                  path = target.split('#')[0]
                  if path and not (md.parent / path).resolve().exists():
                      bad.append(f'{md}: [{m.group(1)}]({target})')
          for b in bad:
              print(f'broken link  {b}')
          print(f'{len(bad)} broken link(s)')
          sys.exit(1 if bad else 0)
          PY

      - name: Every epic slug has a design, every design path exists
        run: |
          python3 - <<'PY'
          import pathlib, re, sys
          problems = []
          for story in sorted(pathlib.Path('docs/stories').glob('*.md')):
              if story.name in ('README.md', '_TEMPLATE.md'):
                  continue
              text = story.read_text(encoding='utf-8')
              fm = text.split('---')[1] if text.startswith('---') else ''
              epic = re.search(r'^epic:[ \t]*(\S+)[ \t]*$', fm, re.M)
              design = re.search(r'^design:[ \t]*(\S+)[ \t]*$', fm, re.M)
              if epic and not pathlib.Path(f'docs/designs/{epic.group(1)}.md').exists():
                  problems.append(f'{story.name}: epic "{epic.group(1)}" has no design doc')
              if design and not pathlib.Path(design.group(1)).exists():
                  problems.append(f'{story.name}: design path "{design.group(1)}" does not exist')
          for p in problems:
              print(p)
          print(f'{len(problems)} problem(s)')
          sys.exit(1 if problems else 0)
          PY

      - name: The board is in sync with story frontmatter
        run: |
          # The board is generated; a hand-edited or stale one is a defect. This
          # asserts the committed board matches what the frontmatter produces.
          if [ -f scripts/gen_board.py ]; then
            python3 scripts/gen_board.py docs
            git diff --exit-code -- docs/stories/README.md
          else
            echo "no board generator in-repo (it lives in the track plugin); skipping"
          fi
