name: ci

# The gate, run on every push and pull request. `scripts/gate.sh` runs the same steps locally, and
# any difference between the two is a bug in the script rather than something to work around here.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Warnings are errors here. They are warnings locally so that an in-progress edit is not
  # unbuildable, and errors here so that none of them reach main.
  RUSTFLAGS: -D warnings

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      # The kernel is a git dependency pinned to a tag, so the cache key is the lockfile: a kernel
      # bump invalidates it, and nothing else does.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: fmt
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: tests
        run: cargo test --workspace --all-features

      # `CF-20`. The e2e job below is wired to exercise the same assertion against a live node. This
      # fixture pins every failure direction without depending on runner sockets or PID visibility.
      # The local patch was removed by `CX-15`; `CF-20` closes only after a GitHub run reaches and
      # passes the real-socket assertion, rather than from workflow wiring alone.
      - name: The e2e socket assertion fails closed
        run: scripts/tests/e2e-socket-count.sh

      - name: features
        run: scripts/check-features.sh

      # The denylist is deliberately not in the repository. Without the secret this step exits 2
      # rather than passing: a provenance gate that is quietly unconfigured is worse than none.
      - name: provenance
        env:
          SIPX_DENYLIST: ${{ secrets.SIPX_DENYLIST }}
        run: scripts/check-provenance.sh --history

  # The declared floor, built on the floor. Its own job rather than a step in `gate`: it needs a
  # different toolchain, and running it in parallel keeps it off the critical path — an MSRV check
  # that slows every PR is one that gets deleted. `scripts/check-msrv.sh` reads the version from
  # Cargo.toml, so this job cannot drift from the manifest the way a hardcoded version here would.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the declared floor's toolchain
        run: |
          floor="$(sed -n 's/^rust-version = "\([0-9.]*\)".*/\1/p' Cargo.toml | head -1)"
          echo "declared floor: ${floor}"
          rustup toolchain install "$floor" --profile minimal

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/msrv
          key: cargo-msrv-${{ runner.os }}-${{ hashFiles('Cargo.toml', 'Cargo.lock') }}
          restore-keys: cargo-msrv-${{ runner.os }}-

      # The script clears RUSTFLAGS itself; the workflow-wide `-D warnings` would otherwise fail
      # the floor on lints that simply differ between two compiler releases.
      - name: The workspace on its declared rust-version
        run: scripts/check-msrv.sh

  # `CF-15`. The end-to-end proof, actually run.
  #
  # `DX-12` recorded this one as not-in-CI because the `sipx` CLI is built from another repository.
  # That reason was true and the conclusion was wrong: it costs a shallow clone and about forty
  # seconds of `cargo build`, against `FC-4` breaking this proof — and two of its siblings — for a
  # whole release with nothing watching. It is the evidence `website/docs/guides/registrations-and-
  # calls.md` offers for the headline claim, so nothing else in this file substitutes for it: the
  # deterministic harness proves the decisions, and this proves the sockets, the wire format and the
  # fact that two *separate processes* agree about a registration.
  #
  # Its own job rather than a step in `gate`, so a red says "the end-to-end call broke" rather than
  # "the gate is red", and so it runs alongside the gate instead of behind it. Not in
  # `scripts/gate.sh` either: the gate must stay runnable without a second checkout.
  e2e:
    runs-on: ubuntu-latest
    # The script's own waits are bounded (the longest is RFC 3261's 64·T1 drain, ~50s), so anything
    # near this ceiling is a hang rather than a slow run, and should be killed as one.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install the toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-e2e-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-e2e-${{ runner.os }}-

      # The far end is the kernel's own phone, built from the **same tag this workspace pins its
      # kernel libraries to** — read out of `Cargo.toml` rather than written here, so a kernel bump
      # moves the phone with it instead of leaving this job proving a call against a version nothing
      # else uses. It stays un-vendored on purpose: the property that makes this a proof rather than
      # a self-test is that the client side is an independent implementation.
      - name: Build the sipx CLI at the pinned kernel tag
        env:
          # Cleared deliberately, as the `msrv` job does. `-D warnings` is this repository's policy
          # for its own code; applying it to someone else's checkout would fail this proof for a lint
          # in the kernel, which says nothing about whether the call completes.
          RUSTFLAGS: ''
        run: |
          tag="$(sed -n 's/^sipx-sip = .*tag = "\([^"]*\)".*/\1/p' Cargo.toml | head -1)"
          echo "kernel tag: ${tag:?no sipx tag found in Cargo.toml}"
          git clone --depth 1 --branch "$tag" \
            https://github.com/codewandler/sipx "$RUNNER_TEMP/sipx-kernel"
          cargo build --release --bin sipx \
            --manifest-path "$RUNNER_TEMP/sipx-kernel/Cargo.toml"

      # The node binds `127.0.0.1:5060` and cannot be made to vary — location-service §3.2 N7, plus
      # `sipx dial` having no `--target`, plus `check-proof-domains.py` requiring a static literal
      # domain; the note above `preflight` in the script sets out all three. That is safe *here* and
      # is the reason this is its own job: `ubuntu-latest` is a fresh VM per job, so exactly one run
      # of this script exists on it and nothing else is listening on 5060. `CF-13` flagged the
      # collision for a developer's second terminal, which the script now refuses with exit 2 rather
      # than failing halfway through.
      - name: A call completes with media flowing directly between the phones
        run: scripts/e2e-call.sh --sipx "$RUNNER_TEMP/sipx-kernel/target/release/sipx"

  # The durable location store gets its own job, with a real database. `RG-4`'s promise is that the
  # PostgreSQL backend passes the *identical* suite the in-memory one does, and the only way to keep
  # that true is to run it.
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: sipx
          POSTGRES_DB: sipx
        ports: ['5432:5432']
        # Without a health check the job races the database's startup, which fails for a reason that
        # has nothing to do with the code.
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Install the toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-pg-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-pg-${{ runner.os }}-

      - name: The PostgreSQL backend against the location-store suite
        env:
          SIPX_CLSTR_TEST_DATABASE_URL: postgres://postgres:sipx@127.0.0.1:5432/sipx
        run: cargo test -p sipx-clstr-node --features postgres
