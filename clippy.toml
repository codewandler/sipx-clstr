# Words that look like code to `clippy::doc_markdown` but are ordinary prose in this domain.
#
# The lint is worth keeping — it catches real identifiers written bare — but backticking `AoR`
# every time it appears in a sentence makes the documentation read like a symbol table. `".."`
# keeps clippy's own default list rather than replacing it.
doc-valid-idents = [
    "..",
    "AoR",
    "PostgreSQL",
    "SplitMix64",
    "SipxCluster",
    "SIPp",
    "rtpengine",
    "WebSocket",
]
