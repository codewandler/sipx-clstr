[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
# Tracks the repository's release tags rather than the crates' own maturity: nothing here is
# published yet (see `publish = false` on every crate), so a second version line would be a
# number nobody could act on. It starts being meaningful when M1's exit criteria hold.
version = "0.13.0"
edition = "2024"
# Derived by building, not by copying: `scripts/check-msrv.sh` compiles the workspace on this
# exact toolchain, and the gate and CI both run it. The previous value (1.88) claimed to "match
# the kernel's floor" and was never checked, so it was simply false — on 1.88 the workspace does
# not compile at all.
#
# 1.91 is the lowest release that works, re-derived on the `v0.10.0` pin by bisecting
# 1.88 → 1.94: 1.88 and 1.90 fail; 1.91, 1.93 and 1.94 pass. **The floor came down by three
# releases and the reason it exists moved**, so the previous derivation is recorded here rather
# than only in the changelog, because "why 1.91" is the question this line gets asked.
# Re-verified on the `v1.0.0-beta.4` pin (`CX-12`): the workspace still builds on 1.91
# (`check-msrv.sh`), the holder below is unchanged, and the kernel's own floor rose only to 1.88,
# which stays beneath ours.
#
# It used to be the kernel's: sipx-transport's `impl<K, I> Default for TimerQueue<K, I>` called
# `BinaryHeap::new()` on an unbounded type parameter, and `BinaryHeap::<T>::new` carried a
# `T: Ord` bound that rustc only relaxed in 1.94, so every consumer inherited 1.94 for a `Default`
# impl. `v0.10.0` bounds it (`impl<K: Eq, I: Ord>`) — which is exactly what the upstream ledger
# row asked for — so that constraint is gone.
#
# What is left is **ours**, which is why the floor is 1.91 and not the kernel's own 1.88:
# `sipx-clstr-proxy/src/from_registrar.rs` calls `Duration::from_hours(1)`, stable since 1.91.
#
#   error[E0658]: use of unstable library feature `duration_constructors_lite`
#   --> crates/sipx-clstr-proxy/src/from_registrar.rs:53:25
#
# The floor must still be re-derived — not carried forward — whenever the `sipx-*` pin below moves,
# and `CX-4` is the story that proved why: carrying 1.94 forward would have left a true number
# attached to a false reason, and the next person to read it would have gone looking upstream for a
# bound that is no longer there. A floor that names a compiler the code cannot be built with is
# worth less than no floor at all; one that names the wrong cause costs an afternoon.
rust-version = "1.91"
license = "MIT OR Apache-2.0"
repository = "https://github.com/codewandler/sipx-clstr"
authors = ["Timo Friedl <timofriedlberlin@gmail.com>"]
keywords = ["sip", "voip", "proxy", "registrar", "cluster"]
categories = ["network-programming"]

[workspace.dependencies]
# Internal crates
sipx-clstr-proxy = { path = "crates/sipx-clstr-proxy", version = "0.13.0" }
sipx-clstr-registrar = { path = "crates/sipx-clstr-registrar", version = "0.13.0" }
sipx-clstr-probe = { path = "crates/sipx-clstr-probe", version = "0.13.0" }
sipx-clstr-node = { path = "crates/sipx-clstr-node", version = "0.13.0" }
sipx-clstr-sim = { path = "crates/sipx-clstr-sim", version = "0.13.0" }
sipx-clstr-affinity = { path = "crates/sipx-clstr-affinity", version = "0.13.0" }

# RFC 8439's AEAD, for `affinity-token` §4's `chacha20-poly1305` algorithm. RustCrypto, the same
# family `hmac` and `sha2` already come from, so the workspace does not grow a second cipher stack.
#
# `default-features = false` is load-bearing rather than tidiness, and it must stay on this line:
# the default feature set turns on `getrandom`, which would put an operating-system entropy source
# inside a crate whose whole contract (`affinity-token` §2, AGENTS.md rule 2) is that randomness
# enters as an injected value. With the features off it is a pure in-place transform over
# caller-supplied buffers, so the sans-IO rule is enforced by the dependency graph rather than by
# review. `AF-4`'s review confirmed `getrandom` reaches this crate for none of its three versions.
chacha20poly1305 = { version = "0.10", default-features = false }

# The kernel, pinned to a released tag rather than to a branch. sipx is not on crates.io, so a
# git dependency is the only honest way to depend on it; a `tag` rather than a `branch` is what
# makes a build reproducible, and what makes "which kernel version is this claim true of?" a
# question with an answer. Bumping it is a deliberate act with a changelog entry.
#
# Pinned at 1.0.0-beta.4 — the kernel's 1.0 beta line. Beyond 0.10.0's surface (all five
# transports, all four transaction machines, RFC 3263, both sides of digest, the generic
# `TimerQueue`), the beta line brings overload control (RFC 7339/7415) live in the transport,
# `#[non_exhaustive]` on every public error enum, a stricter `ResponseBuilder::to_request` that
# refuses a request missing what a response must echo, and a QUIC transport behind a now-default
# feature — so `quinn` enters the dependency graph. Whether to trim that feature off is a
# deliberate decision `CX-12` left open rather than making in passing.
#
# `CX-12` moved this from 0.10.0 — twelve releases in one step — and what it cost is worth knowing
# before the next bump: exactly two source changes. `TransportKind` grew `Quic`, which
# `listen.rs` refuses at construction like `Ws`/`Wss`; and the stricter response builder surfaced
# a real local defect — the echo endpoint's REGISTER carried no `Via` (RFC 3261 §8.1.1.7) and
# nothing had ever noticed, because every consumer of that request was lenient too. The
# `#[non_exhaustive]` pass is why 313 kernel commits otherwise compiled clean here.
#
# What this bump deliberately does **not** do: fix the nonce-uniqueness defect (`CX-5`) or the
# replay window's scan (`RG-15`). `crates/sipx-ua/src/challenge.rs` is byte-identical from
# `v0.7.0` through `v1.0.0-beta.4` — one blob, verified by hash at every ref rather than by
# reading release notes. Both wait on a kernel release that touches that file.
sipx-sip = { git = "https://github.com/codewandler/sipx", tag = "v1.0.0-beta.4" }
sipx-transport = { git = "https://github.com/codewandler/sipx", tag = "v1.0.0-beta.4" }
sipx-sdp = { git = "https://github.com/codewandler/sipx", tag = "v1.0.0-beta.4" }
# `default-features = false` is load-bearing, not tidiness: it drops sipx-ua's `runtime` feature
# and with it `tokio`, so the sans-IO registrar can use the kernel's digest verification without a
# runtime in its decision core. Upstream `X-20` created that seam for exactly this dependency; the
# gate's own rule — no `tokio` outside sipx-clstr-node — is what would otherwise force this repo to
# write digest a second time, and two implementations of one algorithm eventually disagree about
# who is authenticated.
sipx-ua = { git = "https://github.com/codewandler/sipx", tag = "v1.0.0-beta.4", default-features = false }

# Core
bytes = "1"
thiserror = "2"
rand = "0.9"
tracing = "0.1"
# The loop-detection cookie is keyed (proxy-behavior §6) so an outsider cannot forge "not a loop".
# RustCrypto rather than a bespoke construction: the arithmetic is not the interesting part, and a
# hand-rolled MAC in a security position is a liability nobody asked for. Same crates the kernel
# already uses, so the workspace does not grow a second hash stack.
hmac = "0.12"
sha2 = "0.10"
# Only for the durable location store's binding-set encoding. A hand-rolled encoding for a schema
# this shape would be a second parser to get wrong.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# YAML for the cluster configuration document (`DP-8`). JSON is parsed by the same reader:
# the spec asks for one data model behind two encodings, not two parsers.
serde_yaml_ng = "0.10"
# TOML as a third encoding of the same document (`DP-8`, cluster-config §2 D3).
toml = "0.9"
# The argument surface stopped being "tiny and provisional" once it grew identity semantics, which
# was the justification for parsing it by hand.
clap = { version = "4", features = ["derive"] }
# `with-serde_json-1` is what lets a `jsonb` column round-trip as a `serde_json::Value`; without it
# the binding set would need a bespoke text encoding, which is a second parser to get wrong.
postgres = { version = "0.19", features = ["with-serde_json-1"] }

# Async runtime. Never used by the sans-IO crates — if a `tokio` line appears in
# sipx-clstr-proxy's or sipx-clstr-registrar's manifest, something has gone wrong with the
# decision-logic-is-sans-IO rule, not merely with the dependency graph.
tokio = { version = "1", default-features = false }

# Test / bench
pretty_assertions = "1"
proptest = "1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Disabled deliberately: protocol code is full of small numeric casts and long match arms where
# these fire without adding value.
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
# A proxy that panics on a message takes every call on the node with it. These are warnings here
# and errors in CI (`-D warnings`); test modules opt out per-module.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
indexing_slicing = "warn"

[profile.release]
lto = "thin"
codegen-units = 1

# TEMPORARY (`CX-12`): consume the sibling checkout instead of the pinned tag above, at the
# user's instruction, until the current kernel work is pushed. This knowingly overrides the
# upstream ledger's no-patch rule — a patched build is not reproducible — so it must not outlive
# the story: CX-12's acceptance requires this section removed (the tag alone then carries the
# pin) or its survival re-justified in a named follow-up. The tag `v1.0.0-beta.4` is already on
# the GitHub remote, so removal is a one-section delete, not a wait.
[patch."https://github.com/codewandler/sipx"]
sipx-sip = { path = "../sipx/crates/sipx-sip" }
sipx-transport = { path = "../sipx/crates/sipx-transport" }
sipx-sdp = { path = "../sipx/crates/sipx-sdp" }
sipx-ua = { path = "../sipx/crates/sipx-ua" }
