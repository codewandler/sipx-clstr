[package]
name = "sipx-clstr-registrar"
description = "REGISTER processing and the location service: AoR canonicalization, bindings, compare-and-swap."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
publish = false

[features]
default = []
## The `LocationStore` contract as a runnable suite, so every backend runs the *same* rows (`RG-4`).
##
## Test code in a library, deliberately: the PostgreSQL backend lives in the driver crate — IO belongs
## there — and it cannot reach a `#[cfg(test)]` module in this one. A suite copied per backend drifts,
## and the copy that drifts is the one that stops catching things.
test-suite = []
## `serde` derives on the binding schema, so a durable backend can store a set without inventing its
## own encoding.
serde = ["dep:serde", "bytes/serde"]

[dependencies]
serde = { workspace = true, optional = true }
sipx-sip.workspace = true
# The digest primitives, and **only** those: the workspace pin sets `default-features = false`, so
# this does not drag `tokio` or a transport into a sans-IO crate. `tests/sans_io.rs` asserts that
# against the resolved lockfile rather than against this comment.
sipx-ua.workspace = true
bytes.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
pretty_assertions.workspace = true
# The RA vectors answer challenges with the kernel's *client* responder, so the two halves of digest
# are proved to agree rather than each proved to agree with a fixture written here.
bytes.workspace = true

[lints]
workspace = true
