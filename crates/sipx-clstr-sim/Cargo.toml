[package]
name = "sipx-clstr-sim"
description = "The deterministic cluster harness: virtual time, a simulated network, seeded faults."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
publish = false

[dependencies]
# The harness needs the registrar→proxy target bridge to run the register-then-call
# scenario (`RG-6`).
sipx-clstr-proxy = { workspace = true, features = ["registrar-targets"] }
sipx-clstr-probe.workspace = true
sipx-clstr-registrar.workspace = true
sipx-sip.workspace = true
bytes.workspace = true
rand.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
pretty_assertions.workspace = true
# The constellation adapter (`examples/viz/`) encodes frames as JSON; the harness library itself
# stays encoding-free on purpose (see `src/viz.rs`).
serde_json.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true
