# Vector rows that are deliberately not covered yet, and why.
#
# `scripts/check-vectors.py` reads this. Every row in a spec's vector table must be either covered by
# a test or listed here with a reason and the story that will cover it — and a row listed here that
# *is* covered is an error too, because a stale deferral is how a coverage report starts lying.
#
# This is the project's whole deferral ledger, not a corner of it. Two tables:
#
#   [[deferred]]    410 rows over thirteen prefixes, naming fifteen stories — `AI` 97, `MR` 90,
#                   `NN` 52, `CC` 51, `QP` 31, `FR` 22, `SC` 16, `HF` 13, `SS` 12, `OB` 12, `PB` 8,
#                   `LS` 5, `RA` 1.
#   [[unasserted]]   19 rows — `LS` 9, `RA` 5, `PB` 4, `CC` 1 — covered by a test that never compares
#                   the value the row states. `CF-12` added these; they do not count as proved.
#
# It read "the narrow, PB-only ancestor" until `CF-16`. That was true when `PB` was the only
# registered prefix, and it stayed on the file through `CF-8`'s six registrations and `EX-12`'s
# seventh, by which point `PB` was the third *smallest* family here. A header describing a file as
# narrower than it is invites the next reader to add a row without checking the discipline above,
# and that discipline is what keeps a coverage report honest.
#
# It remains the pre-registry form: the requirement-grain registry `EX-2` specifies and `CF-2`
# reports from does not exist yet, and when it does this file folds into it.

[[deferred]]
id = "PB-C-4"
story = "PX-4"
reason = """
A CANCEL matching no transaction is forwarded statelessly. By definition no response context exists
for it, so it never reaches the engine — it is the driver's, and the driver design says so. It
becomes testable when a driver exists to test (PX-4's stateless path, M2).
"""

[[deferred]]
id = "PB-S-1"
story = "PX-4"
reason = "Stateless mode. Specified in PX-1, implemented in M2 when the token path gives it a consumer."

[[deferred]]
id = "PB-S-2"
story = "PX-4"
reason = "Stateless mode — M2."

[[deferred]]
id = "PB-S-3"
story = "PX-4"
reason = "Stateless mode — M2."

[[deferred]]
id = "PB-S-4"
story = "PX-4"
reason = """
Stateless mode's deterministic branch: a retransmission must produce the byte-identical forwarded
message. The stateful engine already derives its branch rather than randomising it, so the property
holds today, but the row belongs to the stateless path it is written for — M2.
"""

[[deferred]]
