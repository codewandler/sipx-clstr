story = "AF-5"
reason = "Transaction affinity — a 2xx ACK routed by token at a foreign edge. Multi-node, M2."

# ── registrar-auth (`RA`) ────────────────────────────────────────────────────────────────────────
#
# `RA-R-7` was deferred here by `RG-10` — a documentation-only pass that added the row without a
# test — and is now proved by `RG-11`:
# `crates/sipx-clstr-sim/tests/register_auth.rs::ra_r_7_…`. Removed rather than left in place,
# because a deferral that names a covered row is the stale entry this file's header calls out.

[[deferred]]
id = "RA-R-8"
story = "CX-5"
reason = """
`N1`, nonce uniqueness per challenge — registrar-auth §6.1. Deferred because it cannot be covered
from this repository *and* because it does not hold: nonce minting is `sipx-ua::challenge`'s (an auth
primitive, AGENTS.md #6), and at the pinned `v0.10.0` its mint is `<issued-at in hex>.<HMAC over
issued-at and realm>` — a pure function of the second, the realm and the secret. Two users of one
tenant challenged in the same second hold one nonce and therefore one replay counter, and the second
correct credential is refused as `RA-R-2` with a `401` carrying no `stale`. The row states the
requirement rather than the current behaviour, so it fails today by construction; that is the point of
writing it. Filed as an `open` row in docs/upstream.md with the reproduction. Coverage is CX-5's
remaining acceptance — a kernel that mints per-challenge entropy, a pinned release carrying it, and
the harness scenario that challenges two users within one simulated second and requires both to
authenticate. CX-5 therefore stays open: closing it would leave this deferral naming a story nobody
will act on.
"""

# ── hook-framework (`HF`) ────────────────────────────────────────────────────────────────────────
#
# Registered by `EX-8`, which added `HF-9` … `HF-13` and could not register only those: the check
# reads every row out of the spec that owns the prefix, so bringing the prefix under the gate brings
# `HF-1` … `HF-8` with it. Every one of the thirteen is a **startup** vector — §7 graph validation
# rejecting a profile — and none can be executed before a hook runtime exists to build a graph:
# there is no crate yet (`CX-2` creates it, `EX-3` implements the runtime). They are deferred as one
# block for one reason, and each row still carries its own so that a row proved early is visible as
