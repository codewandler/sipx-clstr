[[deferred]]
id = "CC-V-5"
story = "ET-4"
reason = """
The `probe` section, descended into. `cluster.probe` (`targets`, `schedule`, `tenant`) is [e2e-probe](../specs/e2e-probe.md) §5's, and this build refuses the `e2e-tester` role at start-up precisely because nothing reads it. `DP-13`'s Acceptance names the successor in as many words — "`e2e-tester` has no runtime driver today, so an identity containing it refuses startup until `ET-4`/`ET-6` supply that driver" — and `ET-4` is the earlier of the two and the one whose `GET /probes` cannot answer without the section being read. The cross-section half is then unavoidable rather than optional: a probe registers in the tenant it names, and a run against an undeclared one has nowhere to register.
"""

