story = "EX-3"
reason = """
Derived `Supported`/`Allow` (G4) and the V6 acceptance set that follows from it. Needs both the
runtime and the registry constants (`EX-2`/`EX-4`) the manifests are meant to name.
"""

[[deferred]]
id = "HF-6"
story = "EX-3"
reason = "Implicit conflict (G2) — two modules advertising the same option tag. Startup validation, no runtime yet."

[[deferred]]
id = "HF-7"
story = "EX-3"
reason = """
Token budget (G5) — `TokenFact` declarations over the module-fact sub-budget. The budget itself is
already normative in affinity-token §3; what is missing is the graph validation that enforces it.
"""

[[deferred]]
id = "HF-8"
story = "EX-3"
reason = "Ordering cycle (G3). Startup validation, no runtime yet."

[[deferred]]
id = "HF-9"
story = "EX-3"
reason = """
A `QueryDecl.on` missing one outcome arm fails the boot (G7). Added by `EX-8` with the rule it
proves; it becomes a test at `EX-3`'s query handling, which is the story that builds the graph
validator this row runs against. The harness half of the same claim is EX-6's
`external_route_*` scenario set, which needs the module as well as the validator.
"""

